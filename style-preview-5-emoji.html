<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Стиль 5 — с эмодзи</title>
<style>
  body { margin:0; font-family:-apple-system,'Segoe UI',sans-serif; background:#000; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#0d0d0d; border-radius:24px; padding:32px; width:380px; border:1px solid #1a1a1a; }
  .label { color:#666; font-size:11px; letter-spacing:2px; text-transform:uppercase; margin-bottom:20px; font-weight:600; }
  .ring-wrap { display:flex; justify-content:center; margin-bottom:24px; position:relative; }
  .ring-center { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; }
  .ring-center .num { font-size:40px; font-weight:800; color:#fff; line-height:1; }
  .ring-center .unit { font-size:11px; color:#666; letter-spacing:1px; text-transform:uppercase; margin-top:4px; }
  .stats { display:flex; gap:10px; margin-bottom:24px; }
  .stat { flex:1; background:#141414; border-radius:14px; padding:14px 10px; text-align:center; border:1px solid #1f1f1f; }
  .stat .icon { font-size:20px; margin-bottom:6px; }
  .stat b { display:block; font-size:20px; color:#fff; font-weight:700; }
  .stat span { font-size:10px; color:#666; letter-spacing:1px; text-transform:uppercase; }
  input, button { width:100%; padding:14px; border-radius:12px; border:1px solid #1f1f1f; margin-bottom:10px; box-sizing:border-box; font-size:14px; background:#141414; color:#fff; }
  input::placeholder { color:#555; }
  button { background:#00e5a0; color:#000; border:none; font-weight:800; font-size:14px; cursor:pointer; letter-spacing:0.5px; text-transform:uppercase; margin-top:6px; }
</style>
</head>
<body>
  <div class="card">
    <div class="label">Сегодня · 12 сент</div>
    <div class="ring-wrap">
      <svg width="180" height="180" viewBox="0 0 180 180">
        <circle cx="90" cy="90" r="78" fill="none" stroke="#1a1a1a" stroke-width="12"/>
        <circle cx="90" cy="90" r="78" fill="none" stroke="#00e5a0" stroke-width="12"
                stroke-dasharray="490" stroke-dashoffset="186" stroke-linecap="round"
                transform="rotate(-90 90 90)"/>
      </svg>
      <div class="ring-center">
        <div class="num">62%</div>
        <div class="unit">🔥 1240 / 2000 ккал</div>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><div class="icon">🥩</div><b>58г</b><span>Белки</span></div>
      <div class="stat"><div class="icon">🥑</div><b>40г</b><span>Жиры</span></div>
      <div class="stat"><div class="icon">🍞</div><b>120г</b><span>Углеводы</span></div>
    </div>
    <input placeholder="🍽 Название блюда">
    <input placeholder="⚖️ Граммовка">
    <button>+ Добавить</button>
  </div>
</body>
</html>
