<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Стиль 4 — Тёплый</title>
<style>
  body { margin:0; font-family:Georgia,'Times New Roman',serif; background:#f4ede4; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { background:#fffaf3; border-radius:20px; padding:36px; width:360px; box-shadow:0 8px 30px rgba(139,94,60,0.12); border:1px solid #e8dcc8; }
  h2 { margin:0 0 4px; color:#8b5e3c; font-size:20px; font-weight:normal; }
  .big { font-size:34px; color:#5c4331; margin-bottom:2px; font-weight:normal; }
  .sub { color:#a68a6d; margin-bottom:22px; font-size:14px; font-style:italic; }
  .progress { background:#f0e4d3; border-radius:10px; height:14px; overflow:hidden; margin-bottom:24px; }
  .fill { background:linear-gradient(90deg,#c99b6a,#e0b088); height:100%; width:62%; }
  .stats { display:flex; justify-content:space-between; margin-bottom:26px; }
  .stat { text-align:center; }
  .stat b { display:block; font-size:18px; color:#8b5e3c; }
  .stat span { font-size:11px; color:#b09a80; }
  input, button { width:100%; padding:12px; border-radius:10px; border:1px solid #e8dcc8; margin-bottom:12px; box-sizing:border-box; font-size:14px; background:#fdf8f0; font-family:Georgia,serif; }
  button { background:#c99b6a; color:white; border:none; font-size:15px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <h2>🍂 Сегодня</h2>
    <div class="big">1 240 ккал</div>
    <div class="sub">из 2 000 ккал на сегодня</div>
    <div class="progress"><div class="fill"></div></div>
    <div class="stats">
      <div class="stat"><b>58г</b><span>Белки</span></div>
      <div class="stat"><b>40г</b><span>Жиры</span></div>
      <div class="stat"><b>120г</b><span>Углеводы</span></div>
    </div>
    <input placeholder="Название блюда">
    <input placeholder="Граммовка">
    <button>Добавить в дневник</button>
  </div>
</body>
</html>
